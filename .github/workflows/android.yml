name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Dùng đúng khóa debug của máy dev (lưu trong secret DEBUG_KEYSTORE_BASE64) để APK có cùng SHA-1
      # đã đăng ký trên Firebase, nhờ vậy đăng nhập Google hoạt động. Chưa có secret thì GitHub tự tạo
      # khóa ngẫu nhiên: APK vẫn chạy nhưng không đăng nhập Google được.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "Đã dùng khóa debug từ secret. SHA-1:"
            keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android | grep -E "SHA1:"
          else
            echo "::warning::Chưa có secret DEBUG_KEYSTORE_BASE64, APK sẽ không đăng nhập Google được."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: so-tiet-kiem-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
